name: tagged-release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish tagged release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag and workspace versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: python
        run: |
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True))
          members = set(metadata["workspace_members"])
          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          mismatches = [f"{p['name']}={p['version']}" for p in metadata["packages"] if p["id"] in members and p["version"] != expected]
          if mismatches:
              raise SystemExit("Release tag does not match workspace versions: " + ", ".join(mismatches))
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libx11-xcb-dev pkg-config libvulkan-dev
      - name: Verify packaged workspace
        run: |
          cargo generate-lockfile
          cargo package --workspace --all-features --locked --target-dir target/release-packages
      - name: Generate release notes
        run: bash .github/release-notes.sh "$GITHUB_REF_NAME" > release_notes.md
      - name: Create GitHub release with crate archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" target/release-packages/package/*.crate \
            --title "Aurea $RELEASE_TAG" --notes-file release_notes.md "${prerelease[@]}"
