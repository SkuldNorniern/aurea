name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libx11-xcb-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Win32 imports stay XP safe
        if: runner.os == 'Windows'
        run: .github/compat/check-win32-imports.ps1
        shell: pwsh

      - name: Main-thread native smoke (macOS)
        if: runner.os == 'macOS'
        run: cargo run --example native_gaps -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  old-os:
    name: Old OS floor (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 10.12
            os: macos-latest
            target: x86_64-apple-darwin
            deployment: "10.12"
          - name: Ubuntu 18.04
            os: ubuntu-latest
            container: ubuntu:18.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout (container)
        if: matrix.container
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl build-essential pkg-config libgtk-3-dev libx11-xcb-dev
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone -q https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .
          git checkout -q ${{ github.sha }}
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v7.0.1
        if: ${{ !matrix.container }}

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.container }}
        with:
          targets: ${{ matrix.target }}

      - name: Check
        run: cargo check --workspace --target ${{ matrix.target }}
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}

  native:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-native-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-native-

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libx11-xcb-dev pkg-config xvfb

      - name: Run display tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace --features zengpu -- --ignored --test-threads=1

      - name: Run display tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --features zengpu -- --ignored --test-threads=1

      # AppKit needs the main thread, which libtest never gives a test.
      - name: Run display tests (macOS)
        if: runner.os == 'macOS'
        run: cargo test --test macos_native -- --ignored

  backends:
    name: GPU backends (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-backends-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-backends-

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libx11-xcb-dev pkg-config \
            libvulkan-dev

      - name: wgpu
        run: cargo clippy --workspace --all-targets --features wgpu -- -D warnings

      - name: zengpu
        run: cargo clippy --workspace --all-targets --features zengpu -- -D warnings

      - name: Backend tests
        run: cargo test --workspace --all-features

      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgtk-3-dev libx11-xcb-dev pkg-config libvulkan-dev
      - run: cargo check --workspace --all-targets --all-features
      - run: cargo test --workspace --doc --all-features
