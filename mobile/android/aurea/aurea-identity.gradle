// Sets an app's identity from its Cargo manifest's [package.metadata.aurea] table.
// Apply after com.android.application, with the Cargo.toml path in extra["aurea.manifest"].
// Keys: name (label), id (applicationId), version ("auto" = package version), build (versionCode).

import groovy.json.JsonSlurper
import javax.inject.Inject
import org.gradle.process.ExecOperations

def manifestPath = project.findProperty('aurea.manifest')
if (manifestPath == null) {
    throw new GradleException('aurea-identity: set extra["aurea.manifest"] to a Cargo.toml before applying it')
}
def manifest = project.file(manifestPath)
if (!manifest.isFile()) {
    throw new GradleException("aurea-identity: no Cargo manifest at ${manifest}")
}

def meta
try {
    def cargo = providers.exec {
        commandLine 'cargo', 'metadata', '--format-version', '1', '--no-deps', '--manifest-path', manifest.path
        ignoreExitValue = true
    }
    def stdout = cargo.standardOutput.asText.get()
    def stderr = cargo.standardError.asText.get()
    if (cargo.result.get().exitValue != 0) {
        throw new GradleException("aurea-identity: cargo metadata failed for ${manifest}:\n${stderr}")
    }
    meta = new JsonSlurper().parseText(stdout)
} catch (GradleException e) {
    throw e
} catch (Exception e) {
    throw new GradleException("aurea-identity: cannot run cargo, install Rust and put cargo on PATH: ${e.message}", e)
}

def pkg = meta.packages.find { new File(it.manifest_path).canonicalPath == manifest.canonicalPath }
    ?: meta.packages.find { it.metadata?.aurea }
def aurea = pkg?.metadata?.aurea
if (aurea == null || !aurea.id) {
    throw new GradleException("aurea-identity: no [package.metadata.aurea] with id in ${manifest}")
}

def appVersion = (aurea.version ?: 'auto') == 'auto' ? pkg.version : aurea.version
def appBuild = aurea.build ?: 1

project.android.buildFeatures.resValues = true
project.android.defaultConfig {
    applicationId = aurea.id
    versionName = appVersion
    versionCode = appBuild as int
    resValue('string', 'app_name', (aurea.name ?: pkg.name) as String)
}

// Each [[package.metadata.aurea.document]] gets intent filters on the app's activity, merged in
// from a manifest written here: view, edit and send by MIME type, and view by extension for senders
// with no type. `extra["aurea.activity"]` names the activity, `.MainActivity` by default.
if (aurea.document) {
    def activity = project.findProperty('aurea.activity') ?: '.MainActivity'
    def filters = new StringBuilder()
    aurea.document.each { document ->
        def ext = (document.ext as String).replaceFirst(/^\./, '')
        def mime = document.mime ?: "application/x-${ext}"
        filters << """
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <action android:name="android.intent.action.EDIT" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:scheme="content" />
                <data android:scheme="file" />
                <data android:mimeType="${mime}" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.SEND" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:mimeType="${mime}" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <action android:name="android.intent.action.EDIT" />
                <category android:name="android.intent.category.DEFAULT" />
                <data android:scheme="content" />
                <data android:scheme="file" />
                <data android:host="*" />
                <data android:pathPattern=".*\\\\.${ext}" />
            </intent-filter>"""
    }
    def documents = project.layout.buildDirectory.file('generated/aurea/documents/AndroidManifest.xml').get().asFile
    documents.parentFile.mkdirs()
    documents.text = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:tools="http://schemas.android.com/tools">
    <application>
        <activity android:name="${activity}" android:launchMode="singleTask" tools:replace="android:launchMode">${filters}
        </activity>
    </application>
</manifest>
"""
    ['debug', 'release'].each { project.android.sourceSets.getByName(it).manifest.srcFile(documents) }
}

// The master icon (`icon` key, relative to the Cargo manifest, `.png` optional) becomes the
// launcher icon: aurea-build writes the mipmaps into build/generated/aurea/res before preBuild.
abstract class AureaIcons extends DefaultTask {
    @InputFile abstract RegularFileProperty getManifest()
    @InputFile abstract RegularFileProperty getMaster()
    @InputFiles abstract ConfigurableFileCollection getTool()
    @Internal abstract RegularFileProperty getToolManifest()
    @OutputDirectory abstract DirectoryProperty getResDir()
    @Inject abstract ExecOperations getExec()

    @TaskAction
    void generate() {
        exec.exec { spec ->
            spec.commandLine('cargo', 'run', '--quiet', '--release', '--manifest-path', toolManifest.get().asFile.path,
                '--bin', 'aurea-build', '--', manifest.get().asFile.path, 'icons', 'android', resDir.get().asFile.path)
        }
    }
}

if (aurea.icon) {
    def iconPath = manifest.parentFile.toPath().resolve(aurea.icon as String).toFile()
    def master = iconPath.isFile() ? iconPath : new File(iconPath.parentFile, iconPath.name.replaceAll(/\.[^.]*$/, '') + '.png')
    if (!master.isFile()) {
        throw new GradleException("aurea-identity: no master icon at ${iconPath} or ${master}")
    }
    def aureaDir = project(':aurea').projectDir.parentFile.parentFile.parentFile
    def resDir = project.layout.buildDirectory.dir('generated/aurea/res')
    project.tasks.register('aureaIcons', AureaIcons) { t ->
        t.manifest.set(manifest)
        t.master.set(master)
        t.tool.from(new File(aureaDir, 'aurea-build/src'), new File(aureaDir, 'aurea-build/Cargo.toml'))
        t.toolManifest.set(new File(aureaDir, 'aurea-build/Cargo.toml'))
        t.resDir.set(resDir)
    }
    project.android.sourceSets.getByName('main').res.directories.add(resDir.get().asFile.path)
    project.tasks.named('preBuild') { it.dependsOn('aureaIcons') }
    project.android.defaultConfig.manifestPlaceholders.put('appIcon', '@mipmap/ic_launcher')
}
