[package]
name = "aurea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native GUI toolkit: windows, native widgets, canvas widgets and a renderer with CPU and optional GPU backends"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["gui", "ui", "native", "canvas", "widgets"]
categories = ["gui", "graphics", "rendering"]
# Apps use `mobile/android/aurea` and `mobile/ios/aurea` from this crate; the rest of `mobile` is the samples.
exclude = [
    ".github",
    "assets",
    "mobile/ios/AureaSmoke*",
    "mobile/ios/build-rust.sh",
    "mobile/ios/Identity.xcconfig",
    "mobile/android/app",
    "mobile/android/gradle",
    "mobile/android/gradlew*",
    "mobile/android/*.kts",
    "mobile/android/gradle.properties",
]

[package.metadata.docs.rs]
features = ["accessibility", "wgpu", "zengpu"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

# The mobile demo app built from `examples/android_demo.rs` and the iOS sample.
[package.metadata.aurea]
name = "Aurea Smoke"
id = "com.aurea.smoke"
version = "auto"
icon = "assets/icon"

[[package.metadata.aurea.document]]
ext = "aureademo"
name = "Aurea Demo Document"
mime = "application/vnd.aurea.demo"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["aurea-foundation", "aurea-ffi", "aurea-render", "aurea-runtime", "aurea-animation", "aurea-build"]
exclude = ["ZenGPU"]

# The published crates move together. They are one library split for build
# times and optional backends, not five independently versioned things, and a
# crate depending on a stale sibling is how a release breaks after it is cut.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/SkuldNorniern/aurea"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
absolute_paths = "deny"
unwrap_used = "deny"
cognitive_complexity = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"

[lib]
name = "aurea"
crate-type = ["rlib", "cdylib"]

[dependencies]
aurea-foundation = { path = "aurea-foundation", version = "0.1.0" }
aurea-ffi = { path = "aurea-ffi", version = "0.1.0" }
aurea-render = { path = "aurea-render", version = "0.1.0", default-features = false }
aurea-runtime = { path = "aurea-runtime", version = "0.1.0" }
log = "0.4.29"
png = "0.18"
accesskit = { version = "0.25", optional = true }
aurea-animation = { path = "aurea-animation", version = "0.1.0", optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { version = "29.0.1", optional = true }

# ZenGPU surface integration and example shaders (feature `zengpu`).
zengpu = { version = "0.1.0", default-features = false, features = ["vulkan", "metal"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35.1", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_System_Com", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = { version = "0.23", optional = true }

[features]
# No GPU backend by default: the GPU 2D path does not yet reach parity with the
# CPU rasterizer (strokes and damage-driven partial repaint are still missing),
# so it stays opt-in until it does.
# Input: keys and mouse are always on. `input` turns on every input feature below.
default = [
    "input",
    "clipboard",
    "files",
    "menu",
    "tray",
    "dialog",
    "single-instance",
    "embed",
    "widgets",
    "ui",
    "effects",
    "system-fonts",
]
input = ["text-input", "ime", "raw-mouse", "pen", "touch", "gestures", "drop-files"]
# Typed text as `TextInput`.
text-input = ["aurea-ffi/text-input"]
# Preedit as `ImePreedit`, the candidate window's place, and ime on and off per field. Needs `text-input`.
ime = ["text-input", "aurea-ffi/ime"]
# `RawMouseMotion` and cursor lock (`CursorGrabMode::Locked`).
raw-mouse = ["aurea-ffi/raw-mouse"]
# Pen samples, `PenBatch`, `PenPredicted`, `PenTap`, pressure and tilt.
pen = ["aurea-ffi/pen"]
# Fingers: `LongPress`, `FingerTap`, `PressCancelled`, and a finger as the mouse.
touch = ["aurea-ffi/touch"]
# Pinch, twist and two-finger scroll: `Magnify`, `Rotate`, `Gesture`.
gestures = ["aurea-ffi/gestures"]
# `FilesHovered`, `FilesDropped`, `FilesHoverEnded`.
drop-files = ["aurea-ffi/drop-files"]
# Clipboard text and images, `window::clipboard`. Native clipboard code only with this on.
clipboard = ["aurea-ffi/clipboard"]
# Opening, revealing and sharing files and folders, and the app's folders. Pick and save on the
# desktop need `dialog` too; on phones they are part of this.
files = ["aurea-ffi/files"]
# Menu bars, `MenuBar` and `Window::create_menu_bar`, and the native menu code.
menu = ["aurea-ffi/menu"]
# Notification area icons, `TrayIcon`.
tray = ["aurea-ffi/tray"]
# Native file, message and colour dialogs. `comdlg32` is linked only with this.
dialog = ["aurea-ffi/dialog"]
# One running copy per user: `app::single_instance`. Its lock file lives in the app's local data
# folder, which is `files`.
single-instance = ["files"]
# Native hosts inside a window, `SwiftUIHost` on macOS, and `embed`'s canvas embedding.
embed = ["aurea-ffi/embed"]
# Native controls: buttons, labels, text, lists and the rest of `elements`. Layout and canvases stay.
widgets = ["aurea-ffi/widgets"]
# The canvas widget toolkit core: `app::run`, the `animation` module it runs on, and the widgets
# outside the parts below.
ui-core = ["dep:aurea-animation"]
# Plots, scope views and `ui::graph`.
ui-graph = ["ui-core"]
# Docking panels: `Dock`, `DockView` and `FloatingPanel`.
ui-dock = ["ui-core"]
# Colour picker, colour wheel and swatches.
ui-color = ["ui-core"]
# Multiline `TextArea`.
ui-text-edit = ["ui-core"]
# The whole canvas widget toolkit: `ui-core` and every part above.
ui = ["ui-core", "ui-graph", "ui-dock", "ui-color", "ui-text-edit"]
# Backdrop blur, frost and the other filter effects on the CPU renderer. Off: a backdrop draws
# nothing.
effects = ["aurea-render/effects"]
# Installed fonts by name and for fallback (DirectWrite, the font folders, Core Text). Off: only
# fonts the app registers, then the built-in face.
system-fonts = ["aurea-render/system-fonts"]
accessibility = ["dep:accesskit", "dep:accesskit_windows", "dep:accesskit_macos", "dep:accesskit_unix", "dep:windows"]
wgpu = ["dep:wgpu", "dep:raw-window-handle"]
# iOS and Android native hosts. Experimental and opt-in; see mobile/README.md
# for sample projects, entry points and platform build requirements. The hosts draw with the
# canvas UI and answer through the sheets, documents and menu and clipboard APIs, so those come
# with it.
mobile = ["aurea-ffi/mobile", "ui", "dialog", "files", "menu", "clipboard"]
# GPU 2D backend via ZenGPU: Metal on macOS, Vulkan elsewhere. Opt-in,
# experimental.
# Forwards to aurea-render (which owns the ZenGpuRenderer) and pulls in
# zengpu so the root crate can build WindowHandles for the window-level API.
zengpu = ["aurea-render/zengpu", "dep:zengpu"]

[[test]]
