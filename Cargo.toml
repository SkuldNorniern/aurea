[package]
name = "aurea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native GUI toolkit with cross-platform windowing, native widgets, and framework-owned CPU rasterizer"
license.workspace = true
readme = "README.md"
repository.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["aurea-foundation", "aurea-ffi", "aurea-render", "aurea-runtime", "aurea-animation"]
exclude = ["ZenGPU"]

# The published crates move together. They are one library split for build
# times and optional backends, not five independently versioned things, and a
# crate depending on a stale sibling is how a release breaks after it is cut.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/SkuldNorniern/aurea"

[workspace.lints.clippy]
absolute_paths = "deny"
unwrap_used = "deny"
cognitive_complexity = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"

[lib]
name = "aurea"
crate-type = ["rlib", "cdylib"]

[dependencies]
aurea-foundation = { path = "aurea-foundation", version = "0.1.0" }
aurea-ffi = { path = "aurea-ffi", version = "0.1.0" }
aurea-render = { path = "aurea-render", version = "0.1.0" }
aurea-runtime = { path = "aurea-runtime", version = "0.1.0" }
aurea-animation = { path = "aurea-animation", version = "0.1.0" }
libc = "0.2"
log = "0.4.29"
png = "0.18"
accesskit = { version = "0.25", optional = true }
jni = { version = "0.21", optional = true }
raw-window-handle = "0.6"
wgpu = { version = "29.0.1", optional = true }

# ZenGPU surface integration and example shaders (feature `zengpu`).
zengpu-hal = { git = "https://github.com/SkuldNorniern/ZenGPU", rev = "234842a4655c20c814bdb90414904a9bb048ef0d", version = "0.0.1", optional = true }
zen-window-handle = { git = "https://github.com/SkuldNorniern/ZenGPU", rev = "234842a4655c20c814bdb90414904a9bb048ef0d", version = "0.1.0", optional = true }
zengpu = { git = "https://github.com/SkuldNorniern/ZenGPU", rev = "234842a4655c20c814bdb90414904a9bb048ef0d", version = "0.0.1", default-features = false, features = ["vulkan", "metal"], optional = true }
zengpu-spirv = { git = "https://github.com/SkuldNorniern/ZenGPU", rev = "234842a4655c20c814bdb90414904a9bb048ef0d", version = "0.0.1", features = ["metal"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35.1", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_System_Com", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = { version = "0.23", optional = true }

[features]
# No GPU backend by default: the GPU 2D path does not yet reach parity with the
# CPU rasterizer (strokes and damage-driven partial repaint are still missing),
# so it stays opt-in until it does.
default = []
accessibility = ["dep:accesskit", "dep:accesskit_windows", "dep:accesskit_macos", "dep:accesskit_unix", "dep:windows"]
wgpu = ["dep:wgpu"]
# iOS and Android hosts. Experimental: the native hosts are placeholders
# that draw nothing yet, so a mobile build has to ask for them.
mobile = ["aurea-ffi/mobile"]
# GPU 2D backend via ZenGPU: Metal on macOS, Vulkan elsewhere. Opt-in,
# experimental.
# Forwards to aurea-render (which owns the ZenGpuRenderer) and pulls in
# zengpu-hal so the root crate can build WindowHandles for the window-level API.
zengpu = [
    "aurea-render/zengpu",
    "dep:zengpu-hal",
    "dep:zen-window-handle",
    "dep:zengpu",
    "dep:zengpu-spirv",
]

[[test]]
name = "macos_native"
harness = false

[[example]]
name = "android_demo"
crate-type = ["cdylib"]
required-features = ["mobile"]

[[example]]
name = "ios_demo"
crate-type = ["staticlib"]
required-features = ["mobile"]

[[example]]
name = "wgpu_window"
required-features = ["wgpu"]

[[example]]
name = "wgpu_canvas"
required-features = ["wgpu"]

[[example]]
name = "zengpu_2d_displaylist"
required-features = ["zengpu"]

[[example]]
name = "zengpu_canvas"
required-features = ["zengpu"]

[[example]]
name = "zengpu_demo"
required-features = ["zengpu"]

[[example]]
name = "zengpu_triangle"
required-features = ["zengpu"]

[[example]]
name = "zengpu_cube"
required-features = ["zengpu"]

[[example]]
name = "zengpu_textured_quad"
required-features = ["zengpu"]

[[example]]
name = "zengpu_offscreen"
required-features = ["zengpu"]

[[example]]
name = "zengpu_shared_context"
required-features = ["zengpu"]

[[example]]
name = "gpu_memory"
required-features = ["zengpu"]

[dev-dependencies]
aurea-render = { path = "aurea-render", version = "0.1.0" }
