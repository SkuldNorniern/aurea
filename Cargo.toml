[package]
name = "aurea"
version = "0.0.2"
edition = "2024"
rust-version = "1.88"
description = "Native GUI toolkit with cross-platform windowing, native widgets, and framework-owned CPU rasterizer"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/SkuldNorniern/aurea"

[lints]
workspace = true

[workspace]
resolver = "2"
members = ["aurea-foundation", "aurea-ffi", "aurea-render", "aurea-runtime", "aurea-animation"]
exclude = ["ZenGPU"]

[workspace.lints.clippy]
absolute_paths = "deny"
unwrap_used = "deny"
cognitive_complexity = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"

[lib]
name = "aurea"
crate-type = ["rlib", "cdylib"]

[dependencies]
aurea-foundation = { path = "aurea-foundation", version = "0.0.1" }
aurea-ffi = { path = "aurea-ffi", version = "0.0.1" }
aurea-render = { path = "aurea-render", version = "0.0.1" }
aurea-runtime = { path = "aurea-runtime", version = "0.0.1" }
aurea-animation = { path = "aurea-animation", version = "0.0.1" }
libc = "0.2"
log = "0.4.29"
jni = { version = "0.21", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[features]
# No GPU backend by default: the GPU 2D path does not yet reach parity with the
# CPU rasterizer (strokes and damage-driven partial repaint are still missing),
# so it stays opt-in until it does.
default = []
wgpu = ["dep:wgpu"]
# GPU 2D backend via ZenGPU (Vulkan). Opt-in, experimental.
# Forwards to aurea-render (which owns the ZenGpuRenderer) and pulls in
# zengpu-hal so the root crate can build WindowHandles for the window-level API.
zengpu = [
    "aurea-render/zengpu",
    "dep:zengpu-hal",
    "dep:zen-window-handle",
    "dep:zengpu",
    "dep:inline-spirv",
]

[dependencies.wgpu]
version = "29.0.1"
optional = true

[dependencies.raw-window-handle]
version = "0.6"

# zengpu-hal: optional, for the window-level GPU surface API (feature `zengpu`).
[dependencies.zengpu-hal]
git = "https://github.com/SkuldNorniern/ZenGPU"
rev = "191f772a6084785d273b4d46141e15f1f6666664"
version = "0.0.1"
optional = true

# zen-window-handle: dependency-free WindowHandle/DisplayHandle types consumed
# by zengpu-hal's WindowHandles::from_raw (feature `zengpu`).
[dependencies.zen-window-handle]
git = "https://github.com/SkuldNorniern/ZenGPU"
rev = "191f772a6084785d273b4d46141e15f1f6666664"
version = "0.1.0"
optional = true

# Only the zengpu examples use these, but a dev-dependency is built for every
# `cargo test` whether it is reachable or not, and inline-spirv needs shaderc
# and a C++ toolchain. As plain optional dependencies they follow the feature
# that actually wants them, so the tests build on a machine without it.
[dependencies.zengpu]
git = "https://github.com/SkuldNorniern/ZenGPU"
rev = "191f772a6084785d273b4d46141e15f1f6666664"
version = "0.0.1"
features = ["vulkan"]
optional = true

[dependencies.inline-spirv]
version = "0.2"
features = ["glsl"]
optional = true

[[example]]
name = "wgpu_window"
required-features = ["wgpu"]

[[example]]
name = "wgpu_canvas"
required-features = ["wgpu"]

[[example]]
name = "zengpu_2d_displaylist"
required-features = ["zengpu"]

[[example]]
name = "zengpu_canvas"
required-features = ["zengpu"]

[[example]]
name = "zengpu_demo"
required-features = ["zengpu"]

[[example]]
name = "zengpu_triangle"
required-features = ["zengpu"]

[[example]]
name = "zengpu_cube"
required-features = ["zengpu"]

[[example]]
name = "zengpu_textured_quad"
required-features = ["zengpu"]

[[example]]
name = "zengpu_offscreen"
required-features = ["zengpu"]

[[example]]
name = "zengpu_shared_context"
required-features = ["zengpu"]

[dev-dependencies]
aurea-render = { path = "aurea-render", version = "0.0.1" }
