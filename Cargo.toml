[package]
name = "aurea"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Native GUI toolkit: windows, native widgets, canvas widgets and a renderer with CPU and optional GPU backends"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["gui", "ui", "native", "canvas", "widgets"]
categories = ["gui", "graphics", "rendering"]
# Apps use `mobile/android/aurea` and `mobile/ios/aurea` from this crate; the rest of `mobile` is the samples.
exclude = [
    ".github",
    "assets",
    "mobile/ios/AureaSmoke*",
    "mobile/ios/build-rust.sh",
    "mobile/ios/Identity.xcconfig",
    "mobile/android/app",
    "mobile/android/gradle",
    "mobile/android/gradlew*",
    "mobile/android/*.kts",
    "mobile/android/gradle.properties",
]

[package.metadata.docs.rs]
features = ["accessibility", "wgpu", "zengpu"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

# The mobile demo app built from `examples/android_demo.rs` and the iOS sample.
[package.metadata.aurea]
name = "Aurea Smoke"
id = "com.aurea.smoke"
version = "auto"
icon = "assets/icon"

[[package.metadata.aurea.document]]
ext = "aureademo"
name = "Aurea Demo Document"
mime = "application/vnd.aurea.demo"

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["aurea-foundation", "aurea-ffi", "aurea-render", "aurea-runtime", "aurea-animation", "aurea-build"]
exclude = ["ZenGPU"]

# The published crates move together. They are one library split for build
# times and optional backends, not five independently versioned things, and a
# crate depending on a stale sibling is how a release breaks after it is cut.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/SkuldNorniern/aurea"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
absolute_paths = "deny"
unwrap_used = "deny"
cognitive_complexity = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"

[lib]
name = "aurea"
crate-type = ["rlib", "cdylib"]

[dependencies]
aurea-foundation = { path = "aurea-foundation", version = "0.1.0" }
aurea-ffi = { path = "aurea-ffi", version = "0.1.0" }
aurea-render = { path = "aurea-render", version = "0.1.0" }
aurea-runtime = { path = "aurea-runtime", version = "0.1.0" }
aurea-animation = { path = "aurea-animation", version = "0.1.0" }
log = "0.4.29"
png = "0.18"
accesskit = { version = "0.25", optional = true }
raw-window-handle = { version = "0.6", optional = true }
wgpu = { version = "29.0.1", optional = true }

# ZenGPU surface integration and example shaders (feature `zengpu`).
zengpu = { version = "0.1.0", default-features = false, features = ["vulkan", "metal"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(target_os = "windows")'.dependencies]
accesskit_windows = { version = "0.35.1", optional = true }
windows = { version = "0.62", optional = true, features = ["Win32_System_Com", "Win32_UI_Accessibility"] }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { version = "0.27.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
accesskit_unix = { version = "0.23", optional = true }

[features]
# No GPU backend by default: the GPU 2D path does not yet reach parity with the
# CPU rasterizer (strokes and damage-driven partial repaint are still missing),
# so it stays opt-in until it does.
default = []
accessibility = ["dep:accesskit", "dep:accesskit_windows", "dep:accesskit_macos", "dep:accesskit_unix", "dep:windows"]
wgpu = ["dep:wgpu", "dep:raw-window-handle"]
# iOS and Android native hosts. Experimental and opt-in; see mobile/README.md
# for sample projects, entry points and platform build requirements.
mobile = ["aurea-ffi/mobile"]
# GPU 2D backend via ZenGPU: Metal on macOS, Vulkan elsewhere. Opt-in,
# experimental.
# Forwards to aurea-render (which owns the ZenGpuRenderer) and pulls in
# zengpu so the root crate can build WindowHandles for the window-level API.
zengpu = ["aurea-render/zengpu", "dep:zengpu"]

[[test]]
name = "macos_native"
harness = false

[[bench]]
name = "damage"
harness = false

[[bench]]
name = "draw"
harness = false

[[bench]]
name = "ui"
harness = false

[[bench]]
name = "gpu"
harness = false
required-features = ["zengpu"]

[[example]]
name = "android_demo"
crate-type = ["cdylib"]
required-features = ["mobile"]

[[example]]
name = "ios_demo"
crate-type = ["staticlib"]
required-features = ["mobile"]

[[example]]
name = "wgpu_window"
required-features = ["wgpu"]

[[example]]
name = "wgpu_canvas"
required-features = ["wgpu"]

[[example]]
name = "zengpu_2d_displaylist"
required-features = ["zengpu"]

[[example]]
name = "zengpu_canvas"
required-features = ["zengpu"]

[[example]]
name = "zengpu_demo"
required-features = ["zengpu"]

[[example]]
name = "zengpu_triangle"
required-features = ["zengpu"]

[[example]]
name = "zengpu_cube"
required-features = ["zengpu"]

[[example]]
name = "zengpu_textured_quad"
required-features = ["zengpu"]

[[example]]
name = "zengpu_offscreen"
required-features = ["zengpu"]

[[example]]
name = "zengpu_shared_context"
required-features = ["zengpu"]

# zengpu past 0.1.0: buffer offsets, base vertex, indirect count. drop after its next release
[patch.crates-io]
zengpu = { git = "file:///D:/Repository/zengpu", rev = "849dac707244639a065fa335072e340fe1b95737" }
zengpu-hal = { git = "file:///D:/Repository/zengpu", rev = "849dac707244639a065fa335072e340fe1b95737" }
zengpu-vulkan = { git = "file:///D:/Repository/zengpu", rev = "849dac707244639a065fa335072e340fe1b95737" }
zengpu-metal = { git = "file:///D:/Repository/zengpu", rev = "849dac707244639a065fa335072e340fe1b95737" }
zengpu-shader = { git = "file:///D:/Repository/zengpu", rev = "849dac707244639a065fa335072e340fe1b95737" }
zengpu-zsl = { git = "file:///D:/Repository/zengpu", rev = "849dac707244639a065fa335072e340fe1b95737" }
zengpu-zslc = { git = "file:///D:/Repository/zengpu", rev = "849dac707244639a065fa335072e340fe1b95737" }
zengpu-spv = { git = "file:///D:/Repository/zengpu", rev = "849dac707244639a065fa335072e340fe1b95737" }
