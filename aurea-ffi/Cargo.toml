[package]
name = "aurea-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust <-> native ABI declarations and native library build for Aurea"
license.workspace = true
repository.workspace = true
keywords = ["gui", "ffi", "native", "win32", "gtk"]
categories = ["gui", "external-ffi-bindings"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]

[lints]
workspace = true

[lib]

[features]
# iOS and Android native hosts; experimental, see the root crate's `mobile`.
mobile = []

[build-dependencies]
cc = "1.2"
pkg-config = "0.3"
