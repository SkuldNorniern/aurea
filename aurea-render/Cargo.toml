[package]
name = "aurea-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CPU/GPU rendering backends, display list, and text pipeline for Aurea"
license.workspace = true
repository.workspace = true
keywords = ["gui", "rasterizer", "canvas", "text", "gpu"]
categories = ["gui", "graphics", "rendering"]

[package.metadata.docs.rs]
features = ["wgpu", "zengpu"]

[lints]
workspace = true

[features]
default = []
# Aurea's own GPU backend, and where accelerated work goes: ZenGPU on the
# platform's own graphics API, Metal on macOS and Vulkan elsewhere. Opt-in.
zengpu = ["dep:zengpu"]
# For fitting Aurea into an application already built around wgpu. A
# compatibility path, not the backend Aurea is designed around.
wgpu = ["dep:wgpu"]

[dependencies]
aurea-foundation = { path = "../aurea-foundation", version = "0.1.0" }
# Text shaping (OpenType, every script), glyph outlines, bidi order and
# line breaking.
harfrust = "0.14"
skrifa = "0.48"
unicode-bidi = "0.3"
unicode-linebreak = "0.1"
log = "0.4"

# ZenGPU: optional, enabled by the `zengpu` feature.
zengpu = { version = "0.1.0", default-features = false, features = ["vulkan", "metal"], optional = true }

# wgpu compatibility backend: optional, enabled by the `wgpu` feature.
wgpu = { version = "29.0.1", optional = true }

# System fonts are mapped, not read.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: hinted ClearType glyph rasterization via DirectWrite.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["dwrite", "dwrite_3", "dcommon", "guiddef", "minwindef", "unknwnbase", "winnt", "windef", "winerror"] }
