[package]
name = "aurea-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CPU/GPU rendering backends, display list, and text pipeline for Aurea"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# Aurea's own GPU backend, and where accelerated work goes. Currently Vulkan
# through ZenGPU. Opt-in; pulls in ash/Vulkan.
zengpu = ["dep:zengpu-hal", "dep:zengpu-spirv", "dep:zengpu-vulkan"]
# For fitting Aurea into an application already built around wgpu. A
# compatibility path, not the backend Aurea is designed around.
wgpu = ["dep:wgpu"]

[dependencies]
aurea-foundation = { path = "../aurea-foundation", version = "0.1.0" }
fontdb = "0.16"
fontdue = "0.9"
log = "0.4"

# ZenGPU: optional, enabled by the `zengpu` feature.
zengpu-hal = { git = "https://github.com/SkuldNorniern/ZenGPU", rev = "52dc95be434ad9567bd8a09fb412d963aeb96a11", version = "0.0.1", optional = true }
zengpu-vulkan = { git = "https://github.com/SkuldNorniern/ZenGPU", rev = "52dc95be434ad9567bd8a09fb412d963aeb96a11", version = "0.0.1", optional = true }
zengpu-spirv = { git = "https://github.com/SkuldNorniern/ZenGPU", rev = "52dc95be434ad9567bd8a09fb412d963aeb96a11", version = "0.0.1", optional = true }

# wgpu compatibility backend: optional, enabled by the `wgpu` feature.
wgpu = { version = "29.0.1", optional = true }

# Windows: hinted ClearType glyph rasterization via DirectWrite.
[target.'cfg(windows)'.dependencies]
dwrote = "0.11"
winapi = { version = "0.3", features = ["dwrite", "dcommon", "winnt", "windef", "winerror"] }
