[package]
name = "aurea-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CPU/GPU rendering backends, display list, and text pipeline for Aurea"
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# GPU 2D backend via ZenGPU (Vulkan). Opt-in; pulls in ash/Vulkan.
zengpu = ["dep:inline-spirv", "dep:zengpu-hal", "dep:zengpu-vulkan"]
# GPU 2D backend via wgpu: community-compat peer to ZenGPU. Opt-in.
wgpu = ["dep:wgpu"]

[dependencies]
aurea-foundation = { path = "../aurea-foundation", version = "0.1.0" }
fontdb = "0.16"
fontdue = "0.9"
log = "0.4"

# ZenGPU: optional, enabled by the `zengpu` feature.
zengpu-hal = { git = "https://github.com/SkuldNorniern/ZenGPU", rev = "191f772a6084785d273b4d46141e15f1f6666664", version = "0.0.1", optional = true }
zengpu-vulkan = { git = "https://github.com/SkuldNorniern/ZenGPU", rev = "191f772a6084785d273b4d46141e15f1f6666664", version = "0.0.1", optional = true }
inline-spirv = { version = "0.2", features = ["glsl"], optional = true }

# wgpu peer 2D backend: optional, enabled by the `wgpu` feature.
wgpu = { version = "29.0.1", optional = true }

# Windows: hinted ClearType glyph rasterization via DirectWrite.
[target.'cfg(windows)'.dependencies]
dwrote = "0.11"
winapi = { version = "0.3", features = ["dwrite", "dcommon", "winnt", "windef", "winerror"] }
